[pytest]
testpaths = tests
pythonpath = .
# -p no:anyio: anyio (FastAPI dependency) auto-loads a pytest plugin we don't use,
# and it triggers a PytestRemovedIn10Warning on pytest 9.
addopts = -ra --strict-markers -p no:anyio
xfail_strict = true
markers =
    live: llama a la API real de Groq (requiere GROQ_API_KEY; no corre en CI)
